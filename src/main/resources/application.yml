spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      pool-name: MaidavHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:12}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:300000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: America/Argentina/Buenos_Aires

  jackson:
    time-zone: America/Argentina/Buenos_Aires

  flyway:
    enabled: true
    baseline-on-migrate: true
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  lifecycle:
    timeout-per-shutdown-phase: ${SERVER_SHUTDOWN_TIMEOUT:30s}

server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: ${SERVER_SESSION_TIMEOUT:8h}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:100}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:20s}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:OFF}

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  security:
    authority-refresh-interval: ${APP_SECURITY_AUTHORITY_REFRESH_INTERVAL:PT5M}
